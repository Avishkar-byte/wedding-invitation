<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="badge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4e0e1d" />
      <stop offset="70%" stop-color="#320610" />
      <stop offset="100%" stop-color="#20030a" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="40%" stop-color="#e2bc43" />
      <stop offset="75%" stop-color="#c99f28" />
      <stop offset="100%" stop-color="#997312" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer circular velvet maroon medallion -->
  <circle cx="32" cy="32" r="30" fill="url(#badge)" stroke="url(#gold)" stroke-width="2" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.75" />

  <!-- Monogram A & S intertwined with gold -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path
      d="M17 44 L25 19 L28.5 19 L36.5 44 L32.5 44 L30.5 37 L23 37 L21 44 Z M24 33.5 L29.5 33.5 L26.8 24.5 Z"
      fill="url(#gold)"
    />
    <!-- Delicate flourishing Ampersand '&' in background center -->
    <text
      x="33"
      y="38"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="16"
      font-style="italic"
      fill="#fff"
      fill-opacity="0.45"
      text-anchor="middle"
    >&amp;</text>
    <!-- Letter S overlapping on the right -->
    <path
      d="M48 24.5 C46.5 21.5 43 20 39.5 20 C34.5 20 31.5 22.8 31.5 26.5 C31.5 33 44 32.5 44 38.5 C44 42 41 44.5 36.5 44.5 C32.5 44.5 29.5 42.5 28.5 39.5 L31.5 38.5 C32.5 40.5 34.5 41.8 36.8 41.8 C39.5 41.8 41 40.5 41 38.5 C41 33 28.5 33 28.5 26.5 C28.5 21.5 32.5 17.5 39.2 17.5 C43.5 17.5 46.8 19.5 48.5 23 Z"
      fill="url(#gold)"
    />
  </g>

  <!-- Top Crown Accent Gem -->
  <circle cx="32" cy="8.5" r="1.5" fill="#fff5cc" />
</svg>
